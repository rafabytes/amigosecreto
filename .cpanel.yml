---
# Deploy pelo cPanel (Git™ Version Control → Gerenciar → Pull or Deploy → Deploy HEAD Commit).
# Copia o tema para o WordPress de produção, sem os arquivos de desenvolvimento. O dist/ já vem
# compilado no repositório: o servidor não precisa de Node.
#
# Caminhos aceitos (o primeiro que existir no servidor; se nenhum existir, o deploy falha):
#   ~/amigosecreto.appmaster.com.br/wp-content/themes   amigosecreto.appmaster.com.br
#   ~/public_html/amigosecreto/wp-content/themes        rafabytes.com/amigosecreto
# Só copia para pastas de temas que já existem, para nunca escrever num caminho errado.
# --chmod: o clone do cPanel tem permissões restritas; sem isso o Apache não lê CSS/JS/imagens (403).
# --delete-excluded remove do servidor arquivos de desenvolvimento (src/, package.json…) que já estejam lá.
deployment:
  tasks:
    - FOUND=0; for THEMES in "$HOME/amigosecreto.appmaster.com.br/wp-content/themes" "$HOME/public_html/amigosecreto/wp-content/themes"; do if [ -d "$THEMES" ]; then FOUND=1; /bin/mkdir -p "$THEMES/amigosecreto-theme/" && /usr/bin/rsync -a --chmod=D755,F644 --delete --delete-excluded --exclude=.git --exclude=.gitignore --exclude=.cpanel.yml --exclude=src/ --exclude=scripts/ --exclude=node_modules/ --exclude=package.json --exclude=package-lock.json --exclude=.postcssrc --exclude=README.md --exclude='*.zip' ./ "$THEMES/amigosecreto-theme/" || exit 1; break; fi; done; [ "$FOUND" = 1 ]
